services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mercado_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mercado_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  streamlit:
    build: .
    command: streamlit run streamlit_app/app.py --server.address 0.0.0.0 --server.port 8501 --browser.gatherUsageStats false
    env_file:
      - .env.example
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - fastapi

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    command: webserver
    env_file:
      - .env.example
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/mercado_intelligence
      POSTGRES_DSN: postgresql+psycopg://postgres:postgres@postgres:5432/mercado_intelligence
      PYTHONPATH: /opt/airflow/project
    ports:
      - "8080:8080"
    volumes:
      - .:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    command: scheduler
    env_file:
      - .env.example
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/mercado_intelligence
      POSTGRES_DSN: postgresql+psycopg://postgres:postgres@postgres:5432/mercado_intelligence
      PYTHONPATH: /opt/airflow/project
    volumes:
      - .:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && (airflow users create --username admin --password admin --firstname Mercado --lastname Intelligence --role Admin --email admin@example.com || true)
    env_file:
      - .env.example
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/mercado_intelligence
      POSTGRES_DSN: postgresql+psycopg://postgres:postgres@postgres:5432/mercado_intelligence
      PYTHONPATH: /opt/airflow/project
    volumes:
      - .:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
